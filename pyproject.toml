[project]
name = "nst-rulebook-mcp"
version = "1.0.0"
description = "국가과학기술연구회(NST/KICA/BRIC) 규정집 MCP 서버"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
nst-rulebook-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
